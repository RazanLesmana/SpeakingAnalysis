{% extends 'base.html' %}

{% block meta %}
    <title>Tambah Topik - SpeakingAnalysis</title>
{% endblock meta %}

{% block content %}
    <main>
        <h1>Tambah Topik</h1>
        <form method="post" action="{% url 'main:create_topic' %}">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit">Simpan</button>
        </form>
    </main>
{% endblock content %}
